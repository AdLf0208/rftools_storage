id = "rftoolsstorage"
name = "RFTools Storage"
version = "0.2.13"
description = """RFTools Storage for Horizon: the modular storage block and the storage scanner. A
storage module in the storage's card slot sets its capacity (tier 1: 100 slots, one item kind a slot,
64 a slot), and the block stores nothing until it is locked. A right click opens the storage's own
menu -- a 10 x 10 grid of its slots with the player's inventory beside it, the card slot that holds
the module and a padlock on the panel; the grid takes a stack only while locked and only in a slot of
its own kind, and the module can be put in or taken back out through its slot. While sneaking, a
click is the quick path instead: a module in hand installs, a held stack inserts, an empty hand seals
or gives a stack back. The storage scanner reads the inventories in a box around it and answers
/rftoolsstorage scan <pos> [query] with what they hold (the GUI list's search: a word is a
case-insensitive name contains, or @modid a namespace prefix), from its own 50,000 FE buffer,
at a radius of 1 to 20
(/rftoolsstorage radius <pos> <n>), and its tick pushes the stacks in its input slots (the player's
and the automation slot) into those inventories, a stack a tick at a time. /rftoolsstorage request
<pos> <item> [<count>] pulls a kind out of those inventories and gives it to the player, a tenth of
the scan's price for a count and the whole price for a stack, while /rftoolsstorage give
<pos> <item> [single] hands one item (or a whole stack) straight to the player for the whole
price without the out slot. /rftoolsstorage insert <pos> <item> [count] is the screen's
insert button: it pushes a stack out of the player's inventory into those inventories and
charges one rfPerInsert, but only when the stack went in whole. /rftoolsstorage sort <pos> <mode> is
the scan list's order (Amount+, Amount-, Mod or Name; Tag needs an item's tags, which this build does
not list), saved with the block so it survives a relaunch. /rftoolsstorage routable <pos> <target>
<on|off> is the list's per-inventory star: only a starred inventory is routed into (the tick, a
request, a give or an insert), while the scan still lists every inventory in the box, and a fresh
scanner starts with nothing starred. /rftoolsstorage export <pos> <current|first> is the list's
export choice: `current` pushes the in-slot stack only into the inventory the list's selected row
names (/rftoolsstorage select <pos> <target>), refusing rather than falling through to the starred
walk, while `first` (the default) is that walk; both are saved with the block. /rftoolsstorage
info|lock
remain the storage's readout and the operator's lock; every command needs an operator or a player
within 8 blocks."""
authors = ["McJty"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not a hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): the block, the storage module item, the creative tab and the recipes are content
# this package registers.
capabilities = ["registries"]
license = "MIT"
homepage = "https://github.com/McJtyMods/RFToolsStorage"
issues = "https://github.com/McJtyMods/RFToolsStorage/issues"

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
